spec_version: "0.1.0"
name: codebase-auditor
version: "1.0.0"
description: >
  Unified multi-dimensional codebase quality assessment — spawns parallel review agents and
  aggregates findings into a single deduplicated, severity-ranked report.
license: MIT

model:
  preferred: claude-sonnet-4-5-20250929
  fallback:
    - claude-opus-4-6
    - claude-haiku-3-5-20241022
  constraints:
    temperature: 0.4
    max_tokens: 16384

skills: []

runtime:
  max_turns: 50
  timeout: 600

tags:
  - audit
  - quality
  - security
  - code-review
  - multi-dimensional
  - pre-release
